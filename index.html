<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SETPOINT</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#071331">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SETPOINT">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ===== SETPOINT v1.14 · refresh visual (somente aparência) ===== */
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-800.woff2) format("woff2")}

/* ---- Cores e tokens (identidade: azul-marinho, azul, vermelho, branco) ---- */
:root{
  --navy:#071331;--navy2:#0f2252;--navy3:#1a3270;--white:#fff;
  --bg:#eef2f9;--card:#fff;--card2:#f5f7fc;--tx:#0a1633;--mut:#5a6b8f;--bd:#d9e0ee;--bd2:#c3cde2;
  --a:#1d4ed8;--b:#d4202f;--af:#1d4ed8;--bf:#d4202f;--ok:#1d4ed8;--dn:#c8182a;
  --fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;--sh:0 1px 2px rgba(7,19,49,.06),0 8px 24px -8px rgba(7,19,49,.14);--sh2:0 18px 40px -16px rgba(7,19,49,.35);
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#040b22;--navy2:#0b1a42;--navy3:#183068;--bg:#071331;--card:#0d1f48;--card2:#0a1a3e;--tx:#f5f8ff;--mut:#a3b3d8;--bd:#1d3470;--bd2:#2a4485;--a:#6b9dff;--b:#ff5263;--af:#2563eb;--bf:#e0243a;--ok:#2563eb;--dn:#ff5a6a;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);--sh2:0 18px 40px -16px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--navy:#040b22;--navy2:#0b1a42;--navy3:#183068;--bg:#071331;--card:#0d1f48;--card2:#0a1a3e;--tx:#f5f8ff;--mut:#a3b3d8;--bd:#1d3470;--bd2:#2a4485;--a:#6b9dff;--b:#ff5263;--af:#2563eb;--bf:#e0243a;--ok:#2563eb;--dn:#ff5a6a;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);--sh2:0 18px 40px -16px rgba(0,0,0,.7);color-scheme:dark}

/* ---- Base ---- */
*{box-sizing:border-box}html,body{margin:0}html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 var(--fb);min-height:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{max-width:980px;margin:0 auto;padding:14px 14px 44px}
h1{margin:0;font:800 30px/1 var(--fd);letter-spacing:.5px;text-transform:uppercase}h1 b{color:var(--b)}
h2,h3{margin:.3em 0;font-family:var(--fd);font-weight:700;letter-spacing:.3px}h3{font-size:22px;line-height:1.15}h4{font-family:var(--fd)}
p{margin:.6em 0}.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap}
.bad{color:var(--dn)}.okm{color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.top h1{position:relative;padding-left:14px}.top h1::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:5px;border-radius:3px;background:linear-gradient(var(--a) 0 50%,var(--b) 50% 100%)}

/* ---- Botões e campos ---- */
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px}
button{cursor:pointer;font-weight:600;font-size:15px;min-height:46px;touch-action:manipulation;transition:transform .08s,opacity .15s,background .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--bd2)}
button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.38;cursor:not-allowed}
button.pri{background:var(--af);color:var(--white);border-color:var(--af);box-shadow:0 6px 16px -8px var(--af)}
button.nv{background:var(--navy);color:var(--white);border-color:var(--navy)}
:root[data-theme="dark"] button.nv{background:var(--navy3);border-color:var(--navy3)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.nv{background:var(--navy3);border-color:var(--navy3)}}
button.dn{color:var(--dn)}button.dn:hover:not(:disabled){border-color:var(--dn)}
button.big{width:100%;padding:16px;min-height:58px;font:700 21px/1 var(--fd);letter-spacing:.6px;text-transform:uppercase;border-radius:14px}
button.big.dn{background:transparent}
button.lnk{background:none;border:0;color:var(--a);padding:6px 4px;min-height:36px;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--a);outline-offset:2px}
input,textarea,select{width:100%;min-height:46px}textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--a);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent)}
select{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select:disabled,input:disabled{opacity:.6}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}

/* ---- Blocos ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
form,.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g4 label{font-size:13px}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.pk{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .big{font-size:18px}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.bar button{flex:1}
.chip{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:3px 12px;margin:2px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.ban{background:var(--ok);color:var(--white);border-radius:16px;padding:14px;text-align:center;font-weight:700;margin:10px 0;box-shadow:var(--sh)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 14px}
th{font:700 12px var(--fb);letter-spacing:.8px;text-transform:uppercase;color:var(--mut);background:var(--card2)}
th,td{border-bottom:1px solid var(--bd);padding:8px 10px;text-align:left;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* ---- Avisos fixos ---- */
#warn:not(:empty){position:fixed;top:0;left:0;right:0;z-index:20;background:var(--dn);color:var(--white);padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));text-align:center;font-weight:700;font-size:14px}
#sync{position:fixed;left:10px;bottom:8px;font-size:11px;font-weight:600;color:var(--mut);pointer-events:none;z-index:5;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--card) 85%,transparent);border:1px solid var(--bd);margin-bottom:env(safe-area-inset-bottom,0px)}
#sync:empty,.v-home #sync{display:none}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:92vw;background:var(--navy);color:var(--white);padding:12px 16px;border-radius:14px;display:none;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.16)}
#toast.on{display:flex;animation:fade .2s}#toast button{min-height:34px;padding:4px 12px;background:var(--bf);color:var(--white);border:0;border-radius:9px}

/* ---- Tela inicial ---- */
.hbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}.hbar .grow{flex:1}.hbar .mut{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.hero{background:var(--navy);border-radius:24px;overflow:hidden;margin-bottom:6px;box-shadow:var(--sh2)}
.hero img{display:block;width:100%;height:auto}.hero .cta{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:68px;padding:12px 14px;border-radius:16px;text-align:left;background:rgba(255,255,255,.07);color:var(--white);border:1px solid rgba(255,255,255,.16);font:700 19px/1.05 var(--fd);letter-spacing:.4px;text-transform:uppercase}
.tile small{font:500 12px/1.2 var(--fb);letter-spacing:0;text-transform:none;opacity:.75}
.tile:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.tile .ic{width:20px;height:20px;margin-bottom:4px;opacity:.9}
.tile.red{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:center;gap:10px;min-height:64px;background:var(--bf);border-color:var(--bf);font-size:24px;box-shadow:0 10px 24px -10px var(--bf)}
.tile.red .ic{width:24px;height:24px;margin:0;stroke-width:2.6}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.sec h3{margin:0;display:flex;align-items:center;gap:8px;font:700 15px var(--fd);letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
.sec h3 .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font:700 12px var(--fb);letter-spacing:0}
.sec.on h3{color:var(--bf)}.sec.on h3 .cnt{background:var(--bf);border-color:var(--bf);color:var(--white)}
.sec button{min-height:36px;padding:4px 8px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.mt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.pill.on{background:var(--bf);color:var(--white);border-color:var(--bf)}
.pill.on::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.res{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px;margin:10px 0}.res .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.res .s{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.mc .row button{flex:1;padding:10px 8px}
/* cartão de partida */
.match{padding:0;overflow:hidden}
.match .mt{padding:12px 14px 0}.mdate{font-size:12px;color:var(--mut);font-weight:500}
.mname{display:block;padding:6px 14px 0;font:700 19px/1.2 var(--fd);letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrows{margin:10px 14px 0;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.mrow{display:grid;grid-template-columns:6px minmax(0,1fr) 52px 48px;align-items:center;gap:10px;min-height:42px;padding-right:4px;background:var(--card)}
.mrow+.mrow{border-top:1px solid var(--bd)}
.mrow .dot{align-self:stretch;background:var(--tc)}.mrow.t0{--tc:var(--a)}.mrow.t1{--tc:var(--b)}
.mrow .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .pts,.mrow .s{text-align:center;font:800 24px/1 var(--fd);font-variant-numeric:tabular-nums}
.mrow .pts{color:var(--mut);font-size:20px}
.mrow.win .n::after{content:" ✓";color:var(--tc)}.mrow.win .s{color:var(--tc)}
.mrow.mh{min-height:26px;background:var(--card2)}.mrow.mh span{font:700 10px var(--fb);letter-spacing:1px;text-transform:uppercase;color:var(--mut);text-align:center}
.match .acts{padding:12px 14px 14px;flex-wrap:nowrap}
.match .acts button{flex:1 1 0;min-width:0;padding:8px 6px;font-size:14px;min-height:42px}
.match .acts button.pri{flex:1.6 1 0;font-size:15px}
.match.lv{border-color:color-mix(in srgb,var(--bf) 45%,var(--bd));box-shadow:0 0 0 1px color-mix(in srgb,var(--bf) 25%,transparent),var(--sh)}
.match.fin .acts button.pri{background:var(--card);color:var(--tx);border-color:var(--bd);box-shadow:none}
/* equipes */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tc{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border-radius:14px;font-size:15px;text-align:left;box-shadow:var(--sh)}
.tc .av{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--white);font:800 15px var(--fd);letter-spacing:.5px;flex:none}
.tc .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc i{font-style:normal;font-size:12px;font-weight:800;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a);flex:none}
.tc i.w{background:color-mix(in srgb,var(--dn) 14%,transparent);color:var(--dn)}
.acct{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.acct .ai{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--a) 12%,transparent);color:var(--a);display:inline-flex;align-items:center;justify-content:center;flex:none}
.acct .at{flex:1;min-width:180px}.acct .at b{display:block}.acct .at .mut{font-size:13px}
.acct .row{flex:1 1 220px}
details.more{margin:22px 0 4px}details.more summary{cursor:pointer;color:var(--mut);font-size:14px;font-weight:600;padding:10px 2px}
.search{margin:4px 0 12px;padding-left:16px}

/* ---- Tela da partida ---- */
body.v-live #app{max-width:1180px;padding-top:6px}.v-live #sync{display:none}
.tb{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg)}
.tb .ttl{flex:1;min-width:0}.tb .ttl b{display:block;font:700 19px/1.15 var(--fd);letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .meta{display:flex;align-items:center;gap:6px;margin-top:3px;min-width:0}
.tb .clk{font-size:13px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip2{display:inline-flex;align-items:center;min-height:24px;padding:1px 9px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--mut);font-size:11px;font-weight:700;white-space:nowrap;box-shadow:none}
.chip2.ok{color:var(--a);border-color:color-mix(in srgb,var(--a) 40%,var(--bd))}
button.chip2{min-height:24px;padding:1px 9px;font-size:11px;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:20px}
.main{max-width:980px;margin:0 auto}
.lv{display:block}
.setind{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 8px}
.setind b{display:inline-flex;align-items:center;padding:5px 16px;border-radius:999px;background:var(--navy);color:var(--white);font:800 clamp(17px,4.2vw,22px)/1 var(--fd);letter-spacing:2px}
:root[data-theme="dark"] .setind b{background:var(--navy3)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .setind b{background:var(--navy3)}}
.setind span{font-size:13px;font-weight:600;color:var(--mut)}
.setres{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
/* faixa do saque */
.srvbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:16px;padding:10px 14px;margin:0 0 10px;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--tc);box-shadow:var(--sh);font-size:16px;color:var(--tx)}
.srvbar.t0x{--tc:var(--a)}.srvbar.t1x{--tc:var(--b)}
.srvk{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--tc);color:var(--white);font:800 13px/1 var(--fd);letter-spacing:1.4px;text-transform:uppercase;flex:none}
.srvk .ic{width:16px;height:16px}
.srvt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.srvt b{color:var(--tc);font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srvp{font:700 20px/1.15 var(--fd);letter-spacing:.3px}.srvp small{font:600 13px var(--fb);color:var(--mut);letter-spacing:0}
.srvbar .lnote2{flex-basis:100%;font-size:12px;color:var(--dn);font-weight:600}
.srvbar .lnk{font-size:13px;font-weight:700;border:1.5px solid var(--bd);border-radius:10px;padding:4px 10px;min-height:34px}
/* placar */
.sb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
.t0{--tc:var(--a);--tf:var(--af)}.t1{--tc:var(--b);--tf:var(--bf)}
.side{position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:0 0 10px;text-align:center;box-shadow:var(--sh);overflow:hidden;transition:box-shadow .2s}
.side.srv{box-shadow:0 0 0 3px var(--tc),var(--sh);border-color:var(--tc)}
.side.glow{animation:glow .8s ease-out}@keyframes glow{from{box-shadow:0 0 0 3px var(--tc),0 0 30px 10px var(--tc)}}
.shd{background:var(--tf);color:var(--white);padding:8px 10px;min-height:52px;display:flex;align-items:center;justify-content:center}
.sname{font:800 clamp(16px,4.2vw,24px)/1.08 var(--fd);letter-spacing:.4px;text-transform:uppercase;overflow-wrap:anywhere;text-align:center;color:inherit}
.sname.nm{font-size:clamp(14px,3.6vw,20px)}.sname.nl{font-size:clamp(12px,3vw,17px)}
.scw{position:relative;display:flex;justify-content:center;padding:6px 6px 0}
.sc{font:800 clamp(88px,30vw,200px)/.92 var(--fd);font-variant-numeric:tabular-nums;color:var(--tc);user-select:none;-webkit-user-select:none;text-align:center;letter-spacing:-1px}
.sc.bump{animation:bump .35s}@keyframes bump{40%{transform:scale(1.1)}}
.plus1{position:absolute;left:50%;top:6%;font:800 clamp(26px,7vw,46px) var(--fd);color:var(--tc);pointer-events:none;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.smeta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:28px;margin:2px 8px 0}
.sbadge{display:inline-flex;align-items:center;gap:5px;font:800 12px/1 var(--fd);letter-spacing:1.4px;padding:5px 10px;border-radius:999px;background:var(--tc);color:var(--white);visibility:hidden;order:2}
.sbadge .ic{width:13px;height:13px}
.side.srv .sbadge{visibility:visible}
.sets{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);display:inline-flex;align-items:center;gap:6px}

/* renova o token quando faltam <60 s; só encerra a sessão se o servidor recusar o refresh (sem internet não desloga) */
async function fresh(){
  if(!SES)return false;
  if(SES.expires_at-Date.now()/1000>60)return true;
  try{const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:SES.refresh_token}});saveSes(mkSes({...j,user:j.user||{id:SES.user.id,email:SES.user.email,user_metadata:{name:SES.user.name}}}));return true}
  catch(e){if(e.status===400||e.status===401||e.status===403){forceOut();return false}throw e}
}
function authMsg(e){const c=e.code||'',m=(e.message||'').toLowerCase();
  if(!e.status)return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  if(c==='invalid_credentials'||m.includes('invalid login'))return 'E-mail ou senha incorretos.';
  if(c==='email_not_confirmed'||m.includes('not confirmed'))return 'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam). Se o link expirou, toque em “Reenviar e-mail de confirmação”.';
  if(c==='user_already_exists'||m.includes('already registered'))return 'Este e-mail já tem conta. Use “Entrar” ou recupere a senha.';
  if(c==='same_password')return 'Escolha uma senha diferente da anterior.';
  if(e.status===429||c.includes('rate_limit'))return 'Muitas tentativas. Espere alguns minutos e tente de novo.';
  if(c==='weak_password'||m.includes('password'))return 'Senha fraca: use pelo menos 6 caracteres.';
  if(c==='validation_failed'||m.includes('email'))return 'Confira o e-mail digitado.';
  return 'Não foi possível concluir ('+(c||e.status)+').';
}

/* ---- Sincronização ---- */
const abort=()=>Object.assign(new Error('abort'),{abort:true});
function schedSync(ms){if(!CLOUD||!SES)return;clearTimeout(SY.t);SY.t=setTimeout(sync,ms||2500)}
async function sync(){
  if(!CLOUD||!SES)return;
  if(SY.busy){SY.again=true;return}
  if(!navigator.onLine){paintSync();return}
  const my=KEY;SY.busy=true;SY.err='';paintSync();
  try{
    if(!(await fresh())||KEY!==my)return;
    for(const k of['teams','matches'])await pull(k,my);
    await push(my);
    SY.r401=false;
    if(cur){cur=DB.matches.find(x=>x.id===cur.id)||null;if(!cur&&view==='live')go('home')}
    if(['home','teams'].includes(view)&&!$('#modal').innerHTML)render();
  }catch(e){
    if(!e.abort){SY.err=e.status?('Erro '+e.status):'rede';if(e.status===401&&!SY.r401){SY.r401=true;SES.expires_at=0;saveSes(SES);SY.again=true}}
  }finally{persist();SY.busy=false;paintSync();if(SY.again){SY.again=false;schedSync(800)}}
}
function applyRow(k,r){
  const arr=DB[k],i=arr.findIndex(x=>x.id===r.id),loc=arr[i],lu=loc?(loc.u||0):0,dirty=!!(loc&&DB.sync.dirty[k][r.id]);
  const tb=DB.sync.del.find(d=>d.k===k&&d.id===r.id);
  if(tb){if(tb.u>=r.client_updated)return;DB.sync.del=DB.sync.del.filter(d=>d!==tb)}
  if(r.deleted){if(dirty&&lu>r.client_updated)return;if(i>=0)arr.splice(i,1);delete DB.sync.dirty[k][r.id];return}
  if(loc&&lu>=r.client_updated)return;
  const item={...r.data,id:r.id,u:r.client_updated};if(k==='teams'&&Array.isArray(item.players)&&!item.players.every(p=>p.fn))item.players=upgradePlayers(item.players);
  if(i>=0)arr[i]=item;else arr.push(item);
  SIG[SIGK(k,item)]=sig(item);delete DB.sync.dirty[k][r.id];
}
async function pull(k,my){
  const last=DB.sync.last[k]||'1970-01-01T00:00:00+00:00';let off=0,max=last;
  for(;;){
    const rows=await api('/rest/v1/'+k+'?select=id,name,data,client_updated,deleted,updated_at&updated_at=gte.'+encodeURIComponent(last)+'&order=updated_at.asc,id.asc&limit=200&offset='+off);
    if(KEY!==my)throw abort();
    for(const r of rows){applyRow(k,r);if(r.updated_at>max)max=r.updated_at}
    if(rows.length<200)break;off+=200;
  }
  DB.sync.last[k]=max;
}
async function push(my){
  for(const k of['teams','matches']){
    const rows=[],snap={};
    for(const id of Object.keys(DB.sync.dirty[k])){const x=DB[k].find(y=>y.id===id);if(!x){delete DB.sync.dirty[k][id];continue}snap[id]=x.u;rows.push({user_id:SES.user.id,id,name:x.name||'',data:x,client_updated:x.u||0,deleted:false})}
    for(const d of DB.sync.del.filter(d=>d.k===k))rows.push({user_id:SES.user.id,id:d.id,name:'',data:{},client_updated:d.u,deleted:true});
    for(let i=0;i<rows.length;i+=10){
      const part=rows.slice(i,i+10);
      await api('/rest/v1/'+k+'?on_conflict=user_id,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:part});
      if(KEY!==my)throw abort();
      for(const r of part){
        if(r.deleted)DB.sync.del=DB.sync.del.filter(d=>!(d.k===k&&d.id===r.id));
        else{const x=DB[k].find(y=>y.id===r.id);if(x&&x.u===snap[r.id])delete DB.sync.dirty[k][r.id]}
      }
      persist();
    }
  }
}
